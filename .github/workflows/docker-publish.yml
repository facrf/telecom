name: Build and Push Multi-Arch Docker Image

on:
  push:
  # Opcional: disparar apenas em tags de versão ou na branch main
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Configura o QEMU para emulação de arquiteturas (permite compilar ARM em runners x86)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Configura o Docker Buildx para suportar múltiplos builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login no Docker Hub (ou altere para GHCR se preferir o GitHub Packages)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Extrai metadados (tags e labels) automáticos baseados nas branches/tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: seu-usuario/seu-scanner-telecom # Altere para o seu repositório de imagem

      # 5. Constrói e envia a imagem para múltiplas arquiteturas de uma só vez
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
